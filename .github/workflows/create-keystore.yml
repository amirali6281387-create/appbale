name: Create Keystore

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore wifi-radar-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias wifi-radar \
            -storepass "Radar@2025#App" \
            -keypass "Radar@2025#App" \
            -dname "CN=Amirali, OU=Development, O=WiFiRadar, L=Tehran, ST=Tehran, C=IR"

      - name: Convert to Base64
        run: |
          base64 wifi-radar-key.jks > keystore_base64.txt

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: wifi-radar-keystore
          path: |
            wifi-radar-key.jks
            keystore_base64.txt